experiment:
  name: phase8_hotness_only
  output_dir: results/phase8_hotness_only

memory:
  node_id: 99
  base_latency: 25
  bandwidth_bytes_per_time: 16

link:
  one_way_latency: 6

local_cache:
  capacity_bytes: 256
  hit_latency: 1
  policy: hotness_only
  hotness:
    min_admit_count: 2
    history_mode: cumulative

workload:
  seed: 8888
  compute_node_ids: [1, 2, 3, 4, 5, 6, 7, 8]
  object_count: 256
  object_size_bytes: 64
  hot_set_churn_fraction: 0.4
  object_size_mode: bimodal
  object_size_small_bytes: 64
  object_size_large_bytes: 256
  large_object_probability: 0.2
  requests_per_node_per_epoch: 64
  epoch_count: 16
  hot_set_size: 8
  hot_access_probability: 0.6
  hot_set_mode: epoch_shift
  cross_node_overlap: medium
